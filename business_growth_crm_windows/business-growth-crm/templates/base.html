<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>{{app_name}}</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="{{url_for('static',filename='style.css')}}" rel="stylesheet" />
  </head>
  <body>
    <nav class="navbar navbar-dark bg-dark px-3">
      <a class="navbar-brand" href="/">Business Growth CRM</a>{% if
      current_user.is_authenticated %}
      <div class="navbar-nav flex-row flex-wrap">
        <a class="nav-link px-2" href="/leads">Leads</a
        ><a class="nav-link px-2" href="/discovery">Discover</a
        ><a class="nav-link px-2" href="/fact-finder">Fact Finder</a
        ><a class="nav-link px-2" href="/outreach">Outreach</a
        ><a class="nav-link px-2" href="/followups">Follow-ups</a
        ><a class="nav-link px-2" href="/campaigns">Campaigns</a
        ><a class="nav-link px-2" href="/import">Import</a
        ><a class="nav-link px-2" href="/settings">Settings</a
        ><a class="nav-link px-2" href="/logout">Logout</a>
      </div>
      {% endif %}
    </nav>
    <main class="container py-4">
      {% with msgs=get_flashed_messages(with_categories=true) %}{% for c,m in
      msgs %}
      <div class="alert alert-{{c}}">{{m}}</div>
      {% endfor %}{% endwith %}{% block content %}{% endblock %}
    </main>
  </body>
</html>
