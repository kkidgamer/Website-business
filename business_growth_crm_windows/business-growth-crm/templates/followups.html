{% extends "base.html" %}{% block content %}<h2>Follow-ups</h2><form method="post" class="card p-3 mb-3"><div class="row g-2"><div class="col-md-5"><select class="form-select" name="lead_id" required>{% for l in leads %}<option value="{{l.id}}">{{l.business_name}}</option>{% endfor %}</select></div><div class="col-md-3"><input class="form-control" type="date" name="due_date" required></div><div class="col-md-4"><input class="form-control" name="note" placeholder="Next step"></div></div><button class="btn btn-primary mt-2">Schedule</button></form><div class="card p-3">{% for f in items %}<div class="d-flex justify-content-between py-2 border-bottom"><span>{{f.lead.business_name}} — {{f.due_date}} — {{f.note}}</span>{% if not f.completed %}<form method="post" action="/followups/{{f.id}}/complete"><button class="btn btn-sm btn-outline-success">Done</button></form>{% else %}Completed{% endif %}</div>{% else %}<p>No follow-ups.</p>{% endfor %}</div>{% endblock %}
