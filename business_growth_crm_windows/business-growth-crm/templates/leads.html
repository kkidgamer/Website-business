{% extends "base.html" %}{% block content %}<div class="d-flex justify-content-between"><h2>Leads</h2><div><a class="btn btn-outline-secondary" href="/export">Export XLSX</a> <a class="btn btn-primary" href="/leads/new">Add lead</a></div></div><form class="row g-2 my-3"><div class="col-md-5"><input class="form-control" name="q" value="{{q}}" placeholder="Search name, phone or town"></div><div class="col-md-3"><select class="form-select" name="status"><option value="">All statuses</option>{% for x in ['New','Contacted','Responded','Interested','Negotiating','Converted','Lost'] %}<option {{'selected' if status==x}}>{{x}}</option>{% endfor %}</select></div><div class="col-md-2"><select class="form-select" name="category"><option value="">All categories</option>{% for x in ['Salon','Hotel','School','Clinic','Other'] %}<option {{'selected' if category==x}}>{{x}}</option>{% endfor %}</select></div><div class="col-md-2"><button class="btn btn-dark w-100">Filter</button></div></form><div class="table-responsive card"><table class="table table-hover mb-0"><tr><th>Business</th><th>Category</th><th>Town</th><th>Phone</th><th>Website check</th><th>Stage</th><th>Score</th></tr>{% for l in leads %}<tr><td><a href="/leads/{{l.id}}">{{l.business_name}}</a></td><td>{{l.category}}</td><td>{{l.town}}</td><td>{{l.phone}}</td><td>{{l.website_status}}</td><td>{{l.status}}</td><td>{{l.score}}</td></tr>{% else %}<tr><td colspan="7">No leads.</td></tr>{% endfor %}</table></div>{% endblock %}
